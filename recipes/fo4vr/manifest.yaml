# Fallout 4 VR — minimal essential base
#
# Schema: ../../docs/MANIFEST_SCHEMA.md
# Rationale, exclusions and disputes: ./README.md
#
# ✅ PINNED AND EXERCISED 2026-08-16. Every installed entry has a fileId resolved from the
#    Nexus API and a sha256 computed from the bytes actually downloaded. All ten Nexus
#    files were fetched, installed, and loaded by F4SEVR in a running game — see
#    docs/VERIFICATION.md and docs/evidence/f4sevr-full-recipe-2026-08-16.log.
#
#    What that does NOT mean: nobody has PLAYED this. Verification runs headless on
#    SteamVR's null driver and proves the plugins load, not that the result is good in a
#    headset. Load order among the three esps is dependency-derived, not observed — no
#    two of these mods are known to conflict yet.
#
#    `candidate` entries are deliberately unresolved and uninstalled.
#
# The exclusion rule (docs/OPEN_QUESTIONS.md #4): a mod earns a place only if it fixes
# something BROKEN or MISSING in vanilla FO4VR. No visual overhauls, no rebalancing, no
# new content. If `why` cannot be written without "nicer" or "I prefer", it is out.

schema: 1

game:
  id: fo4vr
  name: Fallout 4 VR
  mo2GameName: Fallout 4 VR      # VERIFIED 2026-08-16 from MO2's own log
  mo2ShortName: Fallout4VR       # the OTHER string: --game= arg and Documents folder name
  iniNames: [Fallout4.ini, Fallout4Custom.ini, Fallout4Prefs.ini]   # NOT Fallout4VR*.ini
  nexusDomain: fallout4          # FO4VR has no Nexus domain of its own
  steamAppId: 611660
  runtime: "1.2.72"              # verified against the local install 2026-08-16
  dlcRequired: false             # deliberate and DEFERRED — see README.md "DLC"

# ---------------------------------------------------------------------------
# tools — infrastructure, not mods. None of this is on Nexus, which is why the
# vertical slice can be proven before the download story is solved at all.
# ---------------------------------------------------------------------------
tools:
  - id: mo2
    name: Mod Organizer 2
    why: The instance itself. Archive build, not the installer — no registry writes.
    version: "2.5.2"
    source:
      type: github
      repo: ModOrganizer2/modorganizer
      tag: v2.5.2
      asset: Mod.Organizer-2.5.2.7z
    file:
      # VERIFIED 2026-08-16: downloaded, hashed, extracted, launched. First real pin.
      sha256: e6376efd87fd5ddd95aee959405e8f067afa526ea6c2c0c5aa03c5108bf4a815
      size: 149660212
    install: { root: instance }
    notes: Requires Windows 10 1809+ / Windows 11 (Qt 6). Check before extracting.

  - id: f4sevr
    name: Fallout 4 Script Extender VR
    why: >
      Every plugin below is an F4SEVR plugin. Without it none of them load and the
      instance is an elaborate way to run vanilla.
    version: "0.6.21"
    source:
      type: http
      url: http://f4se.silverlock.org/beta/f4sevr_0_6_21.7z
      page: https://f4se.silverlock.org/          # where the URL is published
    file:
      # RESOLVED 2026-08-16. Note silverlock serves plain HTTP, so the hash is not a
      # nicety here — it is the only integrity check on the download.
      sha256: df5b27b29007052ccee236304ffe9b029b9d2fcf8e2ee2118205a6d0be700fb3
      size: 593089
    install:
      root: game                 # loads before usvfs exists — must be a real file on disk
      strip: 1                   # archive has a top-level f4sevr_0_6_21/ directory
      files: [f4sevr_1_2_72.dll, f4sevr_loader.exe, f4sevr_steam_loader.dll, Data/Scripts/]
    verifiedContents:
      f4sevr_1_2_72.dll: 5d162dbebcea12461b7159d30860ab1edcd7ee0de8e7957a6d2d89385cbe25e2
    notes: >
      The local copy at C:\repos\f4sevr is byte-identical to the official archive
      (f4sevr_1_2_72.dll sha256 matches), confirmed 2026-08-16 — so the verified first run
      was already using this exact pinned file.
    verify:
      - runtime matches game.runtime exactly    # 1.2.72; F4SEVR supports one runtime only
    uninstall: Delete the three files and Data/Scripts from the game directory.

# ---------------------------------------------------------------------------
# mods
# ---------------------------------------------------------------------------
mods:

  # --- foundation: nothing else works without these ------------------------
  - id: vr-address-library
    name: VR Address Library for F4SEVR
    why: >
      Lets F4SEVR plugins resolve engine addresses by ID rather than hardcoded offsets,
      so a plugin survives a game patch instead of crashing on load.
    tier: foundation
    required: true
    enabled: true
    source: { type: nexus, modId: 64879, fileId: 310367, version: "1.7.0" }
    file:
      name: 'VR Address Library-64879-1-7-0-1713247141.7z'
      sha256: f0dc32e0e0183baeb94b50fa68f2b3562815e83b777a19db0c286ba932b8882e
      size: 424711
    install: { root: data }
    plugins: []
    verify: [F4SE/Plugins/version-1-2-72-0.csv]   # exact filename, runtime-specific
    notes: >
      VERIFIED LOAD-BEARING 2026-08-16. Anything built on CommonLibF4 fails without it —
      and it fails as a MODAL DIALOG ("REL/IDDB.cpp(82): failed to open ...csv"), i.e. a
      silent hang with no crash and no error code. This entry is why the recipe must
      check declared dependency files exist BEFORE launching. See docs/VERIFICATION.md.
      The CSV is runtime-specific: version-<runtime with dashes>-0.csv.

  - id: fo4vr-tools
    name: Fallout4 VR Tools
    why: >
      Library other VR plugins link against. A dependency, not a feature.
    tier: foundation
    required: true
    enabled: true
    source: { type: nexus, modId: 45167, fileId: 182280, version: "0.1" }
    file:
      name: 'Fallout4VRTools BETA v0.1-45167-v0-1-1589924169.zip'
      sha256: ff9636045e50f4c5d6f0c8fb008fbcbd995d2c4fc63238098dcce6b2601a33dc
      size: 231986
    install: { root: data }
    plugins: []

  - id: xse-plugin-preloader
    name: xSE PluginPreloader F4
    why: >
      Loads F4SE plugins earlier than F4SE itself does. Required by Buffout 4 NG for
      PDB-symbol crash logs; without it the crash logs are addresses, not names.
    tier: foundation
    required: true
    enabled: true
    source: { type: nexus, modId: 33946, fileId: 221778, version: "0.2.5.1" }
    file:
      name: 'xSE PluginPreloader F4 0.2.5.1-33946-0-2-5-1-1637347868.zip'
      sha256: ae0b418c4acb038b8077ef33b2b29d38214a141a3dfcf412a90d9c0efe05348a
      size: 2253885
    install:
      root: game                 # preloads via the game dir, not the virtual filesystem
    plugins: []
    uninstall: Delete IpHlpAPI.dll and xSE PluginPreloader.xml from the game directory.

  - id: buffout-4-ng-vr
    name: Buffout 4 NG and VR
    why: >
      Fixes a set of engine crashes and, more importantly, writes a readable crash log
      when it cannot. Without it a crash is a silent close to desktop.
    tier: foundation
    required: true
    enabled: true
    source: { type: nexus, modId: 64880, fileId: 268840, version: "1.31.1" }
    file:
      name: 'Buffout4 NG-64880-1-31-1-1677574192.7z'
      sha256: 0e3c979197a014ac9090937fd5a283e3c5b49b884ad90aad8bdef7982d009ce9
      size: 16566751
    install: { root: data }
    plugins: []
    verify: [F4SE/Plugins/Buffout4.dll]
    upstream: https://github.com/alandtse/Buffout4
    notes: >
      RESOLVED 2026-08-16: this is alandtse's fork (github.com/alandtse/Buffout4), which
      is the VR-capable one and the only Buffout we install. The original Buffout 4
      (47359, Ryan-rsm-Mckenzie) is NOT installed alongside it — published lists that
      install both are cargo-culting. Open source, so buildable from source if a pin dies.

  # --- fixes: things vanilla FO4VR gets wrong or omits ---------------------
  - id: version-check-patcher
    name: Fallout 4 Version Check Patcher
    why: >
      Vanilla refuses to load plugins built against a different game version, which
      rejects most working FO4 mods outright. Removes the check.
    tier: fix
    required: true
    enabled: true
    source: { type: nexus, modId: 42497, fileId: 172369, version: "1.00" }
    file:
      name: 'vcheck_patcher_v100-42497-1-00-1575961056.rar'
      sha256: 9c96b00413320f0a79e2bc575019502ea158ced70e19e34b529e2bd9feec5580
      size: 68067
    install: { root: data }
    plugins: []

  - id: player-collision-options
    name: Player Collision Options - nocollide actors
    why: >
      NPCs physically shove the player in VR, which moves your view without your head
      moving. That is a nausea trigger, not a preference.
    tier: fix
    required: true
    enabled: true
    source: { type: nexus, modId: 41866, fileId: 170010, version: "1" }
    file:
      name: 'nocollide actors-41866-1-1572607793.zip'
      sha256: e577ecde33ef3bb1b3eedd2ff338f0ec14e101b2632d0f3022a41052f42acbbd
      size: null     # API reports 0; the file is a bare esp, under 1 KB
    install: { root: data }
    plugins: [nocollide_actors.esp]
    notes: >
      RESOLVED 2026-08-16. The author ships each FOMOD permutation as its own standalone
      file as well as a Fomod Installer (170027). Pinning the standalone 'nocollide
      actors' variant drops the FOMOD path entirely — one fewer place for an install-time
      choice to go wrong, and it makes the manifest say plainly which variant we mean.
      The other permutations add clutter/weapons collision, which we do not want.

  - id: weapon-accuracy-redone-vr
    name: Weapon Accuracy Redone for VR
    why: >
      Vanilla applies flat-screen spread and recoil to a weapon you are physically
      aiming, so aimed shots miss where you pointed. Breaks the core VR interaction.
    tier: fix
    required: true
    enabled: true
    source: { type: nexus, modId: 40669, fileId: 164468, version: "1.0" }
    file:
      name: 'Weapon Accuracy Redone (No DLC)-40669-1-0-1565971083.zip'
      sha256: c125309364d3539cb7146400eb3414453cd9520ee561a23295059a0509954665
      size: 1183
    install: { root: data }
    plugins: [WeaponAccuracyRedoneVR.esp]
    notes: >
      RESOLVED 2026-08-16. Four variants exist: No DLC / DLC / Automatron / Far Harbor.
      FO4VR ships standalone with no DLC (verified on disk), so the No DLC file is the
      only correct one — a DLC variant would master against plugins that do not exist.
      If the deferred DLC tier ever lands, this pin changes with it.

  - id: bird-fix
    name: Bird Fix
    why: Vanilla bird records cause a reproducible crash. Straight bug fix.
    tier: candidate                # DEMOTED 2026-08-16 — see notes
    required: false
    enabled: false
    source: { type: nexus, modId: 45429, fileId: 204999, version: "1" }
    file:
      name: 'Bird Fix-45429-1-1617449227.7z'
      sha256: null   # pending download
      size: 918145
    install: { root: data }
    plugins: [UNVERIFIED.esp]
    notes: >
      ⚠️ HOSTING PROBLEM, found while resolving pins 2026-08-16. Mod 45429 is NOT
      "Bird Fix" — it is "GingasVR's Reverb and Ambiance Overhaul ... " by crismanator02,
      a page hosting 48 unrelated miscellaneous files (Frost patches, whole 280 MB MO2
      instances, "Test", "Mod", "Merge"). Bird Fix is one stray file on someone else's
      page.
      This breaks the one-mod-one-page assumption behind the schema, and every file
      there is "version 1", so `version` carries no information and only fileId
      identifies anything. It is also a supply-chain smell: a fix distributed this way
      can change or vanish with no signal, and the page's owner did not author it.
      DEMOTED to candidate rather than deleted: the underlying crash may well be real
      and worth fixing, but not from this source. Find the original author, an
      alternative host, or reproduce the fix — then promote it back.

  # NOTE — NO SCOPE MODS. Deliberate, decided 2026-08-16. The picture-in-picture scope is
  # being fixed AT THE ENGINE LEVEL in C:\repos\fallout4-scope-in-scope-investigation, which
  # removes the defect every scope mod exists to work around. Better Scopes VR (61214) and
  # See-Through-Scopes (9476) were both cut for this reason, not on the exclusion rule.
  # FOLLOW-UP: once that fix ships as a plugin it becomes an entry here, and it is the first
  # entry whose upstream is this developer rather than Nexus.

  - id: frik
    name: FRIK - Full Player Body with IK
    why: >
      Vanilla FO4VR gives the player floating hands and no body — look down and you are
      not there. Missing, not merely improvable.
    tier: fix
    required: true
    enabled: true                # no staging — see notes
    source: { type: nexus, modId: 53464, fileId: 314905, version: "0.66" }
    file:
      name: 'FRIK alpha 66-53464-v0-66-1715094878.zip'
      sha256: 7514ad8c868c7c1e752931b2ac0bebbaebed1173944507ad16b76c5c7633bb23
      size: 3445238
    install: { root: data }
    plugins: [FRIK.esp]   # verified on disk 2026-08-16
    upstream: C:\repos\Fallout-4-VR-Body
    notes: >
      AUTHORED BY THIS PROJECT'S DEVELOPER. Not an outside dependency — source is next
      door at C:\repos\Fallout-4-VR-Body, so a dead pin is a build, not a dead end, and
      the `why` line is first-hand rather than inferred.
      NOT STAGED. Published lists disable FRIK until after the vault prologue; we do not.
      The prologue is skippable with `coc` or an alternate-start mod, and the author has
      fixed the long-standing prologue issues besides. Staging would add a stateful,
      mid-playthrough step to a recipe whose whole value is being reproducible.
      For verification this costs nothing: devbench's `console` tool can run `coc` itself,
      so the agent skips the prologue without a human touching the game.

  - id: full-dialog-vr
    name: Full Dialog VR
    why: >
      Vanilla shows four paraphrased prompts; VR's menu placement makes them worse.
      Shows the line that will actually be spoken.
    tier: fix
    required: false                # KEPT, confirmed 2026-08-16
    enabled: true
    source: { type: nexus, modId: 28516, fileId: 117525, version: "1.1" }
    file:
      name: 'Full Dialog VR - List v1.1-28516-v1-1.zip'
      sha256: 8bfba301afd65ed8dda5a3c56195c7f099ca3a029cc5bc7a6e352b346a924f73
      size: 32716144
    install: { root: data }
    plugins: []   # none — interface + strings replacer, verified on disk 2026-08-16
    postInstall:
      - delete: interface/MultiActivateMenu.swf    # required for the VR fix

  - id: mcm-vr
    name: Mod Configuration Menu (MCM_VR)
    why: >
      FRIK and others are configured in-game through MCM. Without it their settings are
      unreachable in a headset.
    tier: fix
    required: true
    enabled: true
    source:
      type: nexus
      modId: 21497
      fileId: 316521
      version: "1.0.0"
    install: { root: data }          # standalone VR zip, not the FOMOD installer
    file:
      name: 'MCM_VR-21497-1-0-0-1715710309.zip'
      sha256: 40ccfe7e54f6abe90b117f674411e9cf3cc0ec3d15af8068bead474c75e83786
      size: 374641
    plugins: []
    notes: >
      RESOLVED BY HAND 2026-08-16 — the resolver correctly refused to guess. Five files
      share a version that normalises to "1" (1.0, 1.0.0, 1), so version carries no
      information and only the filename distinguishes them. That is the case the schema's
      "propose, never adopt" rule exists for.
      Pinned to the standalone MCM_VR zip, which also avoids the FOMOD path.
      ⚠️ NEWER FILE EXISTS: fileId 400967, "MCM VR b2", uploaded 2026-06-20 — roughly two
      years newer than this pin. Deliberately NOT taken: a pin should be what was tested,
      and nothing here has tested either. Worth evaluating, then promoting on purpose.

  # --- performance: the hardware-adaptive half -----------------------------
  # Installed deterministically; CONFIGURED by the agent from the real GPU/headset.
  - id: vrperfkit
    name: vrperfkit
    why: >
      Upscaling and fixed-foveated rendering. FO4VR has no resolution scaling worth the
      name, so on a weak GPU the choice is otherwise "blurry" or "20fps".
    tier: performance
    required: false
    enabled: true
    source: { type: github, repo: fholger/vrperfkit, tag: v0.3, asset: vrperfkit_v0.3.zip }
    file:
      # RESOLVED 2026-08-16. v0.3 is the latest release (2022-03-18); upstream is dormant.
      sha256: 9c1c1f022e232088275ba9d8e70f6068592d2dd6ea017d738bdee650c648032a
      size: 406397
    install:
      root: game
      files: [dxgi.dll, vrperfkit.yml]   # archive also has x86/dxgi.dll — 64-bit game, skip it
    adaptive:
      # THE AGENT DECIDES THESE. Everything above this line is pinned.
      file: vrperfkit.yml
      decide: [upscaling.method, upscaling.renderScale, fixedFoveated.enabled]
      inputs: [gpu, vram, headsetRenderResolution, measuredFrametime]
    uninstall: Delete dxgi.dll and vrperfkit.yml from the game directory.

  - id: fo4vr-improvements
    name: fo4vr_improvements (contrast adaptive sharpening)
    why: >
      FO4VR's TAA is extremely soft at headset resolutions. Sharpening recovers detail
      the renderer already produced.
    tier: performance
    required: false
    enabled: true
    source:
      type: github
      repo: fholger/f4ovr_improvements
      tag: cas_v2                # NOT "vcas_v2" — published lists have this wrong
      asset: fo4vr_contrast_adaptive_sharpening_v2.7z
    file:
      # RESOLVED 2026-08-16.
      sha256: af6bddd0a11172a246f799116785cb41dc3865d414a688be06e5278a091b2b15
      size: 57188
    install:
      root: game
      files: [openvr_api.dll, fo4_openvr.cfg]
    overwritesStockFiles:
      # ⚠️ THE ONLY ENTRY THAT REPLACES A SHIPPED GAME FILE. Back it up before install.
      openvr_api.dll:
        stockSha256: 8768bb31597f7d10af8b2a68fe543ac111032e8d91c46e57dd90bd5c7bfe12de
        stockSize: 522528        # game's own, dated 2024-06-19
        modSize: 188928          # this mod's, dated 2021-02-19
    uninstall: Restore the backed-up stock openvr_api.dll; delete fo4_openvr.cfg.
    notes: >
      Skip on WMR or Vive Wand controllers per the author.
      RISK, flagged 2026-08-16: this replaces the game's openvr_api.dll (2024) with a
      2021 build — a ~334KB downgrade of the OpenVR runtime shim, not a mod file. On a
      Quest 3 over Virtual Desktop that is exactly the layer in use. Demote to
      `candidate` unless it is measurably worth it; the pin is resolved either way.

  # --- candidates: not adjudicated. do not install without a decision. -----
  - id: address-library-f4se
    name: Address Library for F4SE Plugins
    why: DISPUTED — this is the flat-FO4 library (1.10.163). May be redundant with
         vr-address-library on a VR-only instance. Resolve before shipping.
    tier: candidate
    required: false
    enabled: false
    source: { type: nexus, modId: 47327, fileId: 191018, version: "1.10.163.0" }
    file:
      name: 'Addres Library-47327-1-10-163-0-1599728753.zip'
      sha256: null   # pending download
      size: 9554944
    install: { root: data }
    plugins: []

# ---------------------------------------------------------------------------
# order
# ---------------------------------------------------------------------------
order:
  # modlist.txt, WINNER FIRST — written out verbatim, NO reversal (measured 2026-08-16 by
  # core/tests/test-conflict-order.ps1; the earlier "reverse this" instruction was wrong and
  # would have handed every conflict to the loser). See MO2_PORTABLE.md §4.
  # The ORDER ITSELF is still UNVERIFIED: derived from dependency direction, not from any
  # observed conflict. None of these mods is yet known to fight another.
  #
  # Absent by design, not by omission: vrperfkit / fo4vr-improvements install to
  # `root: game` and so live outside MO2's virtual filesystem; the two `candidate`
  # entries are not installed until adjudicated. See MANIFEST_SCHEMA.md `order`.
  install:
    - mcm-vr
    - frik
    - weapon-accuracy-redone-vr
    - player-collision-options
    - full-dialog-vr
    # bird-fix demoted to candidate 2026-08-16 (hosting problem, see its notes)
    - version-check-patcher
    - buffout-4-ng-vr
    # xse-plugin-preloader is deliberately absent: root=game, so it lives outside usvfs
    # and has no conflict priority. Caught by `mla doctor` 2026-08-16.
    - fo4vr-tools
    - vr-address-library

  # plugins.txt / loadorder.txt. Masters first.
  # UNVERIFIED: plugin filenames are placeholders until each archive is inspected.
  plugins:
    - Fallout4.esm
    - Fallout4_VR.esm
